name: Test APK

# Throwaway: builds a side-by-side test APK ("Low End test",
# com.luigir86.low_end.test) from this branch for phone checks.
# Never merged into main.
on:
  push:
    branches: ['claude/**-apk']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter test tool/make_icons_test.dart
      - name: Separate test app
        run: |
          sed -i 's/applicationId = "com.luigir86.low_end"/applicationId = "com.luigir86.low_end.test"/' android/app/build.gradle.kts
          sed -i 's#android:label="@string/app_name"#android:label="Low End test"#' android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId' android/app/build.gradle.kts
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --target-platform android-arm64
      - run: cp build/app/outputs/flutter-apk/app-release.apk LowEnd-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LowEnd-test
          path: LowEnd-test.apk
          retention-days: 14
      - name: Remove the key
        if: ${{ always() }}
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
