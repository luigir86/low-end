name: CI

# The workflow always starts, so that the checks `main` requires always
# report. The first job looks at what changed: when it is only texts (see
# `changes` below) the three real jobs are skipped, and a skipped job counts
# as passed for a required check. Filtering the trigger by paths instead
# left a texts-only pull request waiting for a check that never came.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code: no other permission is needed.
permissions:
  contents: read

# A new push to a pull request stops the run of the previous one; on main
# every merge is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs side by side: the run lasts as long as the longest one.
jobs:
  # Is there anything to build or test? Texts only (Markdown, docs/, store/)
  # means no, except the action catalog, which a test compares with the code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked as merged into its base: the first
          # parent is the base. On main, from the last commit that was there.
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base="$BEFORE"
          fi
          # Not sure what changed: build and test everything.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: code moved into docs/ also counts as leaving lib/.
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/llm-actions.json) code=true ;;
              *.md | docs/* | store/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --no-renames --name-only "$base" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Also when `changes` itself failed: better to test than to skip.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Catches a mistake in the manifest or in Gradle before it reaches a
  # phone. Debug: a release build needs the upload key (see store/README.md).
  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Keeps Gradle and the Android libraries between runs (saved by main,
      # read by pull requests).
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      # arm64 only (nearly every phone, the S20 FE too): the C++ audio engine
      # is compiled once instead of once per processor type. The .aab for the
      # Play Store is built on the PC and still holds every type.
      - run: flutter build apk --debug --target-platform android-arm64
      # The Player's system player (ExoPlayer) declares ACCESS_NETWORK_STATE;
      # the app's manifest removes it (RNF-PRIV-01, docs/offline.md). INTERNET
      # is allowed here: the debug manifest adds it for the tools.
      - name: The merged manifest holds no ACCESS_NETWORK_STATE
        run: |
          files=$(find build/app -path '*merged_manifest*' -name AndroidManifest.xml)
          echo "$files"
          test -n "$files"
          ! grep -l ACCESS_NETWORK_STATE $files
      # The Kotlin side of sharing, saving and "Open with Low End", on the
      # computer with Robolectric (android/app/src/test). flutter build
      # above wrote the Gradle wrapper and the plugins' settings.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Android test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: build/app/reports/tests/

  # The same for the web app (docs/web.md); web.yml publishes it.
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      - run: flutter build web --wasm --release --no-web-resources-cdn
