name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      # Texts only: nothing to build or test.
      - '!**.md'
      - '!docs/**'
      - '!store/**'
      # Except the action catalog, which a test compares with the code.
      - 'docs/llm-actions.json'
  # No paths here: `test` is a required check of main, and a workflow left out
  # by a filter never reports it, so the pull request waits for ever. The
  # `changes` job below skips the work instead, and a skipped job counts as
  # passed.
  pull_request:

# The workflow only reads the code: no other permission is needed.
permissions:
  contents: read

# A new push to a pull request stops the run of the previous one; on main
# every merge is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs side by side after `changes`: the run lasts as long as the longest
# one.
jobs:
  # Is there anything to build? On a pull request, no when it only changes
  # texts (the same list as `paths` above); a push got past `paths` already.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A pull request checks out its merge with main: the first parent is main.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            echo "$files"
            if ! echo "$files" | grep -qvE '[.]md$|^docs/|^store/' &&
              ! echo "$files" | grep -qx 'docs/llm-actions.json'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # `!= 'false'` and `!cancelled()`: if `changes` fails, the work still runs.
  # Otherwise these jobs would be skipped, and the required check would pass.
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Catches a mistake in the manifest or in Gradle before it reaches a
  # phone. Debug: a release build needs the upload key (see store/README.md).
  android:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Keeps Gradle and the Android libraries between runs (saved by main,
      # read by pull requests).
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      # arm64 only (nearly every phone, the S20 FE too): the C++ audio engine
      # is compiled once instead of once per processor type. The .aab for the
      # Play Store is built on the PC and still holds every type.
      - run: flutter build apk --debug --target-platform android-arm64
      # The Player's system player (ExoPlayer) declares ACCESS_NETWORK_STATE;
      # the app's manifest removes it (RNF-PRIV-01, docs/offline.md). INTERNET
      # is allowed here: the debug manifest adds it for the tools.
      - name: The merged manifest holds no ACCESS_NETWORK_STATE
        run: |
          files=$(find build/app -path '*merged_manifest*' -name AndroidManifest.xml)
          echo "$files"
          test -n "$files"
          ! grep -l ACCESS_NETWORK_STATE $files

  # The same for the web app (docs/web.md); web.yml publishes it.
  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --wasm --release --no-web-resources-cdn
