name: CI

# The workflow always starts, so that the checks `main` requires always
# report. The first job looks at what changed: when it is only texts (see
# `changes` below) the three real jobs are skipped, and a skipped job counts
# as passed for a required check. Filtering the trigger by paths instead
# left a texts-only pull request waiting for a check that never came.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code: no other permission is needed.
permissions:
  contents: read

# A new push to a pull request stops the run of the previous one; on main
# every merge is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs side by side: the run lasts as long as the longest one.
jobs:
  # Is there anything to build or test? Texts only (Markdown, docs/, store/)
  # means no, except the action catalog, which a test compares with the code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked as merged into its base: the first
          # parent is the base. On main, from the last commit that was there.
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base="$BEFORE"
          fi
          # Not sure what changed: build and test everything.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: code moved into docs/ also counts as leaving lib/.
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/llm-actions.json) code=true ;;
              *.md | docs/* | store/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --no-renames --name-only "$base" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Also when `changes` itself failed: better to test than to skip.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the last Flutter the app is tested with (CLAUDE.md); 3.50 needs a
          # migration first (material_ui package, Android Gradle Plugin 9.1.1).
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Catches a mistake in the manifest or in Gradle before it reaches a
  # phone. Debug: a release build needs the upload key (see store/README.md).
  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the last Flutter the app is tested with (CLAUDE.md); 3.50 needs a
          # migration first (material_ui package, Android Gradle Plugin 9.1.1).
          flutter-version: 3.50.0
          cache: true
      # Keeps Gradle and the Android libraries between runs (saved by main,
      # read by pull requests).
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source GitHub Actions cache, not the commercial one
          # that v6 uses by default.
          cache-provider: basic
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      # arm64 only (nearly every phone, the S20 FE too): the C++ audio engine
      # is compiled once instead of once per processor type. The .aab for the
      # Play Store (release-play.yml or the PC) still holds every type.
      - run: flutter build apk --debug --target-platform android-arm64
      # The Player's system player (ExoPlayer) declares ACCESS_NETWORK_STATE;
      # the app's manifest removes it (RNF-PRIV-01, docs/offline.md). INTERNET
      # is allowed here: the debug manifest adds it for the tools.
      - name: The merged manifest holds no ACCESS_NETWORK_STATE
        run: |
          files=$(find build/app -path '*merged_manifest*' -name AndroidManifest.xml)
          echo "$files"
          test -n "$files"
          ! grep -l ACCESS_NETWORK_STATE $files
      # The Kotlin side of sharing, saving and "Open with Low End", on the
      # computer with Robolectric (android/app/src/test). flutter build
      # above wrote the Gradle wrapper and the plugins' settings.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Android test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests
          path: build/app/reports/tests/

  # The same for the web app (docs/web.md); web.yml publishes it.
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    # 24.04: the WebKitGTK packages the iPhone tests use (newer images
    # renamed webkit2gtk-driver).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the last Flutter the app is tested with (CLAUDE.md); 3.50 needs a
          # migration first (material_ui package, Android Gradle Plugin 9.1.1).
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      # Served under /low-end/ with its service worker, as on GitHub Pages.
      - run: flutter build web --wasm --release --no-web-resources-cdn --base-href /low-end/
      - run: dart run tool/web_offline.dart build/web
      # The web app in Safari's engine with the iPhone's rules (test_web/,
      # docs/web.md): WebKitGTK's MiniBrowser, driven by WebDriver.
      - name: Install WebKit (Safari's engine)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends webkit2gtk-driver libwebkit2gtk-4.1-0 xvfb gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: iPhone tests in WebKit
        env:
          LOW_END_WEB_SHOTS: build/iphone-tests
        run: xvfb-run -a node --test --test-reporter=spec test_web/iphone_test.mjs
      # The same tests in Chrome, the browser of Android phones, with the
      # Chrome and ChromeDriver the runner comes with (CHROMEWEBDRIVER).
      - name: The same tests in Chrome
        if: ${{ !cancelled() }}
        env:
          LOW_END_WEB_BROWSER: chrome
          LOW_END_WEB_SHOTS: build/chrome-tests
        run: node --test --test-reporter=spec test_web/iphone_test.mjs
      - name: Screens of the failed iPhone tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-tests
          path: |
            build/iphone-tests/
            build/chrome-tests/

  # The real app on an Android emulator (integration_test/app_test.dart):
  # the real sound engine, microphone, recorder and Player, which the tests
  # above replace with silent twins. It catches an update of Flutter or of a
  # package that breaks the app on a phone; timing, Bluetooth and calls are
  # still checked by ear on the phone.
  device:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: flutter pub get
      - run: flutter test tool/make_icons_test.dart
      # GitHub's Linux runners let the emulator use the processor's
      # virtualisation (KVM) once allowed.
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Android 14 (the Galaxy S20 FE's generation), with sound: the default
      # options would start it without (-noaudio) and the engine would fail.
      # Nobody is there to answer Android's questions: while flutter test
      # builds and installs the app, the microphone and the notification
      # are allowed to it as soon as it is on the emulator.
      - name: The app on an Android 14 emulator
        # The emulator sometimes hangs as it shuts down: a failed test must
        # not keep the job waiting.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            sh -c 'while true; do adb shell pm grant com.luigir86.low_end android.permission.RECORD_AUDIO 2>/dev/null; adb shell pm grant com.luigir86.low_end android.permission.POST_NOTIFICATIONS 2>/dev/null; sleep 1; done' &
            flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded
