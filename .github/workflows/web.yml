name: Web app

# Builds the web app and publishes it on GitHub Pages
# (https://luigir86.github.io/low-end/) on every push to main. GitHub Pages
# must be switched on once: Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the last Flutter the app is tested with (CLAUDE.md); 3.50 needs a
          # migration first (material_ui package, Android Gradle Plugin 9.1.1).
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # Generate native/web colours and icons from the single Dart accent.
      - run: flutter test tool/make_icons_test.dart
      # Everything from the site itself, nothing from Google's servers.
      # --wasm: Chrome and Edge get the app in WebAssembly, drawn on its own
      # thread (smoother); Safari and Firefox the JavaScript build as before.
      # LOW_END_BUILD: the commit, shown in About next to the version.
      - run: flutter build web --wasm --release --no-web-resources-cdn --base-href /low-end/ --dart-define=LOW_END_BUILD=${{ github.sha }}
      # The service worker that keeps the app on the phone (docs/web.md).
      - run: dart run tool/web_offline.dart build/web
      # Debugging symbols of the drawing engine: never asked for.
      - run: find build/web -name '*.symbols' -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
